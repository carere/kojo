$schema: "../../.moon/cache/schemas/project.json"

tasks:
  test:
    command: bun --bun vitest run --project unit
    inputs:
      - "@group(configs)"
      - "@group(sources)"
      - "@group(tests)"
      - "@group(workspace)"
    type: test

  integration-test:
    command: bun --bun vitest run --project integration --passWithNoTests
    inputs:
      - "@group(configs)"
      - "@group(sources)"
      - "@group(tests)"
      - "@group(workspace)"
    type: test
