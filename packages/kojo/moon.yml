layer: library
language: typescript

dependsOn:
  - kojo-client-contracts
  - kojo-runner-contracts

tasks:
  check-packages:
    command: bun src/scripts/check-package-graph.ts
    inputs:
      - /apps/console/package.json
      - /moon.yml
      - /packages/*/package.json
      - /packages/kojo/managed-release.json
      - /packages/*/runtime-manifest.json
      - /tsconfig.json
    options:
      cache: false
  # Both test tasks launch Vitest through `bun`, and the `bun` is not decoration. `vitest.mjs` has a
  # `#!/usr/bin/env node` shebang, so invoking the binary directly runs the whole suite — workers and
  # all — under Node. Kojo's runtime is Bun: it depends on `@effect/platform-bun` and
  # `@effect/sql-sqlite-bun`, and the latter imports the `bun:sqlite` builtin. Under Node that import
  # is `ERR_UNSUPPORTED_ESM_URL_SCHEME`, which Vitest reports as a *failed suite* — the file
  # contributes zero tests rather than failing tests. That is the third check in this build that
  # could pass while doing no work, so it is written down here rather than rediscovered: a test tier
  # must run on the runtime the code targets, or the adapters that define that runtime are untestable
  # and their test files quietly evaporate.
  test:
    command: bun node_modules/.bin/vitest run --project unit
    inputs:
      - /.github/scripts/systemd-shipped-singleton-evidence.sh
      - src/**/*
      - tests/unit/**/*
      - tests/support/**/*
      - vitest.config.ts
  test-integration:
    command: bun node_modules/.bin/vitest run --project integration
    inputs:
      - src/**/*
      - tests/fixtures/**/*
      - tests/integration/**/*
      - tests/support/**/*
      - vitest.config.ts
  test-host:
    command: bun node_modules/.bin/vitest run --project host --reporter=verbose
    inputs:
      - src/**/*
      - tests/host/**/*
      - vitest.config.ts
    options:
      cache: false
  test-release-macos:
    command: bun node_modules/.bin/vitest run --project release-macos --reporter=verbose
    deps:
      - console:build
    inputs:
      - /README.md
      - /packages/kojo-client-contracts/**/*
      - /packages/kojo-runner-contracts/**/*
      - /packages/kojo-runtime/**/*
      - console/**/*
      - managed-release.json
      - package.json
      - src/**/*
      - tests/release/**/*
      - tests/support/release/**/*
      - vitest.config.ts
    options:
      cache: false
  # Sandcastle's build asserts Effect never leaks out of its published types. This asserts the
  # inverse for Kojo: no bare promise reaches ours, so the boundary in
  # contexts/sandbox/adapters/boundary.ts cannot quietly spread.
  #
  # It grades the emitted declarations, so it depends on the inherited `tsc` task. Its real inputs
  # live in the workspace type cache rather than in this project, so it is not cached — a guard that
  # reports a stale answer is worse than one that always runs.
  check-public-types:
    command: bun src/scripts/check-public-types.ts
    deps:
      - ~:tsc
    options:
      cache: false
  # The published CLI package contains its sources and the Console assets that the Daemon serves.
  #
  # Not cached: its input is a directory another project writes, so a cache hit here would report a
  # Console that is no longer there.
  build:
    command: bun src/scripts/check-console-build.ts
    deps:
      - console:build
    options:
      cache: false
