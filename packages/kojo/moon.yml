layer: library
language: typescript

dependsOn:
  - kojo-client-contracts
  - kojo-runner-contracts

tasks:
  link-runtime:
    command: bun src/scripts/link-runtime.ts
    preset: utility
    options:
      cache: false
  tsc:
    outputs:
      - /.moon/cache/types/packages/kojo
  check-packages:
    command: bun src/scripts/check-package-graph.ts
    inputs:
      - /.github/tsconfig.json
      - /apps/console/package.json
      - /moon.yml
      - /packages/*/package.json
      - /packages/*/src/**/*
      - /packages/kojo/managed-release.json
      - /packages/*/runtime-manifest.json
      - /tsconfig.json
      - src/scripts/check-package-graph.ts
  # Both test tasks launch Vitest through `bun`, and the `bun` is not decoration. `vitest.mjs` has a
  # `#!/usr/bin/env node` shebang, so invoking the binary directly runs the whole suite — workers and
  # all — under Node. Kojo's runtime is Bun: it depends on `@effect/platform-bun` and
  # `@effect/sql-sqlite-bun`, and the latter imports the `bun:sqlite` builtin. Under Node that import
  # is `ERR_UNSUPPORTED_ESM_URL_SCHEME`, which Vitest reports as a *failed suite* — the file
  # contributes zero tests rather than failing tests. That is the third check in this build that
  # could pass while doing no work, so it is written down here rather than rediscovered: a test tier
  # must run on the runtime the code targets, or the adapters that define that runtime are untestable
  # and their test files quietly evaporate.
  test:
    command: bun node_modules/.bin/vitest run --project unit
    inputs:
      - /.github/scripts/systemd-native-evidence.sh
      - /.github/scripts/systemd-shipped-login-readiness.sh
      - /.github/scripts/systemd-shipped-login-state-evidence.sh
      - /.github/scripts/systemd-shipped-linger-authorization.sh
      - /.github/scripts/systemd-shipped-logout-readiness.sh
      - /.github/scripts/systemd-shipped-singleton-evidence.sh
      - /packages/kojo-client-contracts/src/**/*
      - /packages/kojo-runner-contracts/src/**/*
      - /packages/*/package.json
      - package.json
      - src/**/*
      - tests/unit/**/*
      - tests/support/**/*
      - vitest.config.ts
      - tsconfig.json
  test-integration:
    command: bun node_modules/.bin/vitest run --project integration
    inputs:
      - /apps/console/src/**/*
      - /apps/console/vite.config.ts
      - /packages/*/package.json
      - /packages/kojo-client-contracts/src/**/*
      - /packages/kojo-runner-contracts/src/**/*
      - /packages/kojo-runtime/src/**/*
      - /packages/kojo-runtime/runtime-manifest.json
      - /packages/kojo-runtime/tests/support/**/*
      - managed-release.json
      - src/**/*
      - tests/fixtures/**/*
      - tests/integration/**/*
      - tests/support/**/*
      - vitest.config.ts
      - tsconfig.json
  test-repository:
    command: bun node_modules/.bin/vitest run --project repository
    inputs:
      - /.agents/**/*
      - /.github/**/*
      - /.kojo/**/*
      - /README.md
      - /cog.toml
      - /moon.yml
      - /.moon/toolchains.yml
      - /docs/adr/**/*
      - /docs/design/**/*
      - /docs/release-notes/**/*
      - /apps/console/package.json
      - /apps/console/src/**/*
      - /apps/console/vite.config.ts
      - /packages/*/package.json
      - /packages/*/src/**/*
      - /packages/*/LICENSE
      - /packages/*/runtime-manifest.json
      - /packages/kojo-runtime/tests/support/**/*
      - managed-release.json
      - tests/repository/**/*
      - tests/fixtures/release/**/*
      - tests/support/release/**/*
      - vitest.config.ts
      - tsconfig.json
  # This task checks the current native service manager, which is outside the workspace.
  test-host:
    command: bun node_modules/.bin/vitest run --project host --reporter=verbose
    inputs:
      - src/**/*
      - tests/host/**/*
      - tests/support/daemon/**/*
      - /packages/kojo-client-contracts/src/**/*
      - /packages/kojo-runner-contracts/src/**/*
      - /packages/*/package.json
      - vitest.config.ts
      - tsconfig.json
    options:
      cache: false
  # Native installation state and evidence under RUNNER_TEMP cannot be restored by Moon.
  test-release-macos:
    command: bun node_modules/.bin/vitest run --project release-macos --reporter=verbose
    deps:
      - console:build
    inputs:
      - /.github/release-packages.json
      - /.github/scripts/release-train.ts
      - /.github/scripts/stage-release-package.ts
      - /README.md
      - /.release-train/packages/**/*
      - $KOJO_SHIPPED_MACOS_EVIDENCE
      - $KOJO_RELEASE_ARCHIVES
      - $KOJO_RELEASE_EVIDENCE_ROOT
      - $GITHUB_ACTIONS
      - $RUNNER_ENVIRONMENT
      - $RUNNER_OS
      - $RUNNER_TEMP
      - /packages/kojo-client-contracts/**/*
      - /packages/kojo-runner-contracts/**/*
      - /packages/kojo-runtime/**/*
      - console/**/*
      - managed-release.json
      - package.json
      - src/**/*
      - tests/release/**/*
      - tests/support/release/**/*
      - vitest.config.ts
      - tsconfig.json
    options:
      cache: false
  # Check the Runtime declarations restored or emitted by its TypeScript dependency.
  check-public-types:
    command: bun src/scripts/check-public-types.ts
    deps:
      - kojo-runtime:tsc
    inputs:
      - src/scripts/check-public-types.ts
      - src/contexts/sandbox/guards/promiseFreeTypes.ts
  # The Console build owns its output and restores it before this shell check.
  build:
    command: bun src/scripts/check-console-build.ts
    deps:
      - console:build
    inputs:
      - src/scripts/check-console-build.ts
