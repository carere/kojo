branch_whitelist = ["main"]
monorepo_version_separator = "@"
tag_prefix = "v"
pre_bump_hooks = []
pre_package_bump_hooks = ["bun ../../.github/scripts/cocogitto-package-version.ts {{version}}"]
# A bump owns versions, changelogs, its commit, and Git tags. It does not publish packages or push
# refs. The operator inspects the result and pushes the commit and tags atomically. Publication then
# runs in the manual prerelease or release workflow, where Host validation and promotion can stop
# without making `latest` point to an invalid package set.
post_bump_hooks = []

[commit_types.build]
bump_patch = true

[commit_types.chore]
bump_patch = true

[commit_types.perf]
bump_patch = true

[commit_types.refactor]
bump_patch = true

[commit_types.revert]
bump_patch = true

[commit_types.style]
bump_patch = true

[monorepo]
resolver = "Npm"

# These are exactly the coordinated public packages. The private Console is content inside the
# Kojo archive, not a separately versioned Release package.
[monorepo.packages]
kojo = { path = "packages/kojo", public_api = true }
kojo-client-contracts = { path = "packages/kojo-client-contracts", public_api = true }
kojo-runner-contracts = { path = "packages/kojo-runner-contracts", public_api = true }
kojo-runtime = { path = "packages/kojo-runtime", public_api = true }

[[changelog.authors]]
signature = "abatan.k@gmail.com"
username = "carere"
