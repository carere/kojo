name: prerelease

# Publishing is always a manual action. A successful run publishes one immutable package set,
# validates that exact set from the public registry on both supported Hosts, and records an accepted
# GitHub prerelease. The active prerelease tag and `next` then point to this package set.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Release stage"
        required: true
        type: choice
        options:
          - alpha
          - beta
          - rc
      version:
        description: "Exact prerelease version, for example 0.1.0-alpha.1"
        required: true
        type: string
      previous_candidate:
        description: "Accepted previous candidate; leave empty for an alpha"
        required: false
        type: string
      dry_run:
        description: "Build the candidate but do not publish it"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-train
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish ${{ inputs.stage }} candidate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate the Release stage and coordinated version
        run: bun .github/scripts/release-train.ts validate-prerelease "${{ inputs.stage }}" "${{ inputs.version }}" "${{ inputs.previous_candidate }}"

      - name: Load the accepted previous candidate
        if: ${{ inputs.previous_candidate != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .release-train/previous
          gh release download "v${{ inputs.previous_candidate }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern release-manifest.json \
            --dir .release-train/previous
          bun .github/scripts/release-train.ts verify-predecessor .release-train/previous/release-manifest.json "${{ inputs.version }}" "${{ inputs.previous_candidate }}"
          bash .github/scripts/verify-accepted-prerelease.sh .release-train/previous/release-manifest.json

      - name: Require complete evidence for this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "::error::this revision has no successful CI run with complete supported-Host evidence."
            exit 1
          fi
          mkdir -p /tmp/kojo-complete-release-evidence
          gh run download "$run_id" --name complete-breaking-release-evidence --dir /tmp/kojo-complete-release-evidence
          bun .github/scripts/complete-release-evidence.ts verify-complete /tmp/kojo-complete-release-evidence "$GITHUB_SHA"

      - name: Git identity for test fixtures
        run: |
          git config --global user.name "kojo release"
          git config --global user.email "release@kojo.invalid"

      - name: TypeScript build
        run: bun tsc --build --verbose

      - name: Biome check
        run: bun biome check --verbose --no-errors-on-unmatched .

      - name: Dead-code analysis
        run: bun knip

      - name: Contract, runtime, and unit tests
        run: moon run kojo-client-contracts:test kojo-runner-contracts:test kojo-runtime:test kojo-runtime:test-integration kojo:test kojo:check-packages

      - name: Container tests
        run: moon run kojo:test-integration

      - name: Public types and package build
        run: moon run kojo:check-public-types kojo:build

      - name: Pack the coordinated package set
        run: bun .github/scripts/release-train.ts pack "${{ inputs.version }}" .release-train/packages

      - name: Write the candidate manifest
        run: bun .github/scripts/release-train.ts create-manifest "${{ inputs.stage }}" "${{ inputs.version }}" "$GITHUB_SHA" .release-train/packages .release-train/release-manifest.json

      - name: Upload the candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: .release-train
          if-no-files-found: error
          retention-days: 30

      - name: Confirm that the version is unused
        if: ${{ !inputs.dry_run }}
        run: bun .github/scripts/release-train.ts assert-unpublished "${{ inputs.version }}"

      - name: Publish under the candidate tag
        if: ${{ !inputs.dry_run }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun .github/scripts/release-train.ts publish .release-train/release-manifest.json candidate

      - name: Verify the public candidate and protect latest
        if: ${{ !inputs.dry_run }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          bun .github/scripts/release-train.ts verify-published .release-train/release-manifest.json
          bun .github/scripts/release-tags.ts .release-train/release-manifest.json protect-latest

      - name: Dry run notice
        if: ${{ inputs.dry_run }}
        run: echo "::notice::the candidate was built but was not published."

  validate:
    name: Validate public candidate on ${{ matrix.host }}
    if: ${{ !inputs.dry_run }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: Linux
            os: ubuntu-24.04
          - host: macOS
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Download the candidate manifest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-candidate
          path: .release-train

      - name: Verify and install the exact public package set
        env:
          BUN_INSTALL: ${{ runner.temp }}/kojo-release-validation
        run: |
          bun .github/scripts/release-train.ts verify-manifest .release-train/release-manifest.json "${{ inputs.stage }}" "${{ inputs.version }}" "$GITHUB_SHA"
          bun .github/scripts/release-train.ts verify-published .release-train/release-manifest.json
          bun .github/scripts/release-train.ts install .release-train/release-manifest.json "$RUNNER_TEMP/project" "$BUN_INSTALL"

  accept:
    name: Accept the prerelease
    if: ${{ !inputs.dry_run }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Download the candidate manifest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-candidate
          path: .release-train

      - name: Record the accepted prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v${{ inputs.version }}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
            test "$(git rev-list -n 1 "$release_tag")" = "$GITHUB_SHA"
            gh release upload "$release_tag" .release-train/release-manifest.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$release_tag" .release-train/release-manifest.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Kojo ${{ inputs.version }}" \
              --notes "Validated ${{ inputs.stage }} package set for revision $GITHUB_SHA." \
              --prerelease
          fi

      - name: Activate the accepted prerelease tags
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun .github/scripts/release-tags.ts .release-train/release-manifest.json
