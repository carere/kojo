name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest
    env:
      MOON_REMOTE_CACHE_TOKEN: ${{ secrets.MOON_REMOTE_CACHE_TOKEN }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint conventional commits
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          command: check

      - name: Install Playwright browser
        working-directory: apps/visualizer
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Build
        run: moon run :build

      - name: Biome check
        run: bun biome check --verbose --no-errors-on-unmatched .

      - name: TypeScript build
        run: bun tsc --build --verbose

      - name: Unit tests
        run: moon run :unit-test

      - name: Integration tests
        run: moon run --concurrency 1 :integration-test

      - name: Browser tests
        run: moon run --concurrency 1 :browser-test
