name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MOON_REMOTE_CACHE_TOKEN: ${{ secrets.MOON_REMOTE_CACHE_TOKEN }}

jobs:
  ci:
    name: Core checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NO_COLOR: "1"
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Git identity for the fixtures
        run: |
          git config --global user.name "kojo ci"
          git config --global user.email "ci@kojo.invalid"

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Lint conventional commits
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: check

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: ./.github/actions/core-checks

  integration:
    uses: ./.github/workflows/integration.yml
    secrets:
      MOON_REMOTE_CACHE_TOKEN: ${{ secrets.MOON_REMOTE_CACHE_TOKEN }}
    with:
      revision: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  required:
    name: Test
    if: ${{ always() }}
    needs: [ci, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every check
        env:
          CORE_RESULT: ${{ needs.ci.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          echo "Core checks: $CORE_RESULT"
          echo "Integration tests: $INTEGRATION_RESULT"
          if [ "$CORE_RESULT" != success ] || [ "$INTEGRATION_RESULT" != success ]; then
            echo "::error::A required check failed or did not run. See the job results above."
            exit 1
          fi
