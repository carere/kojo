name: ci

# **Both triggers, and the push one is not decoration.** A required status check called `Test` was
# declared on `main` while this workflow ran on pull requests only, so a direct push produced no
# status of that name and the rule gated nothing — it printed a warning on every push and stopped
# none of them. A check that cannot fail is the same shape of lie as a test that passes while doing
# no work, which this repository keeps a list of.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REMOSHU_TOKEN: ${{ secrets.REMOSHU_TOKEN }}

jobs:
  ci:
    # The name branch protection matches on. Changing it silently un-gates `main`.
    name: Test
    runs-on: ubuntu-latest
    # The container tier builds an image and starts real containers; the browser tier builds the
    # Console first. Twenty minutes is roughly four times the observed run, which leaves room for a
    # slow runner without letting a hung daemon hold the queue all day.
    timeout-minutes: 30
    env:
      NO_COLOR: "1"
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # pick the pr HEAD instead of the merge commit
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      # The suites stamp repositories and commit into them. A runner has no identity of its own, and
      # `git commit` without one fails with a message about `user.email` rather than about the test.
      #
      # **`init.defaultBranch` is deliberately not set here.** It was, for one day: the first CI run
      # of the container tier failed four suites with *the workspace is on master, and the merge
      # targets main*, because the fixtures ran a bare `git init` and took whatever the machine
      # offered. Declaring it made CI green and moved the assumption from one machine's
      # configuration to another's. Ticket 59 fixed the fixtures instead — every one of them now
      # passes `--initial-branch` built from `defaultTrunk`, the same constant `kojo init` stamps as
      # the trunk — so a runner's `master` default is no longer something this repository has an
      # opinion about. **Leaving it unset is what keeps that true**; if it comes back, the fixtures
      # have quietly started inheriting again.
      - name: Git identity for the fixtures
        run: |
          git config --global user.name "kojo ci"
          git config --global user.email "ci@kojo.invalid"

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Lint conventional commits
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          command: check

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --- the repo-wide checks, cheapest first --------------------------------------------------

      - name: TypeScript build
        run: bun tsc --build --verbose

      - name: Biome check
        run: bun biome check --verbose --no-errors-on-unmatched .

      - name: Dead-code analysis
        run: bun knip

      - name: Contract JSON codec source
        run: bun .github/scripts/check-contract-codecs.ts

      # --- the tiers ------------------------------------------------------------------------------
      # Every task is run **by name**, because a tier that is not named here is a tier nobody runs.
      # Discover the list with `moon query tasks`; it is not hardcoded anywhere else.

      - name: Contract and runtime tests
        run: |
          set -o pipefail
          mkdir -p .release-evidence/logs
          moon run kojo-client-contracts:test -- --reporter=verbose 2>&1 | tee .release-evidence/logs/contract-runtime.log
          moon run kojo-runner-contracts:test -- --reporter=verbose 2>&1 | tee -a .release-evidence/logs/contract-runtime.log
          moon run kojo-runtime:test -- --reporter=verbose 2>&1 | tee -a .release-evidence/logs/contract-runtime.log
          moon run kojo-runtime:test-integration -- --reporter=verbose 2>&1 | tee -a .release-evidence/logs/contract-runtime.log

      - name: Unit tests and package graph
        run: |
          set -o pipefail
          moon run kojo:test -- --reporter=verbose 2>&1 | tee .release-evidence/logs/kojo-unit.log
          moon run kojo:check-packages 2>&1 | tee -a .release-evidence/logs/kojo-unit.log

      # Two guards that are neither a test tier nor a lint: no bare promise reaches Kojo's published
      # declarations, and the package refuses to build without the Console in it.
      - name: Public types and package build
        run: moon run kojo:check-public-types kojo:build

      - name: Install Chromium for the browser tier
        run: bun x playwright install --with-deps chromium
        working-directory: apps/console

      - name: Browser tests
        run: |
          set -o pipefail
          moon run console:test-browser -- --reporter=list 2>&1 | tee .release-evidence/logs/console-browser.log

      - name: Browser failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-traces
          path: apps/console/test-results
          retention-days: 7

      # Last because it is the slowest and the only one that needs a container daemon. `ubuntu-latest`
      # ships Docker; the suites build the one image they need and skip with a stated reason if the
      # daemon is missing, so a runner without one says so rather than passing quietly.
      - name: Container tests
        run: |
          set -o pipefail
          moon run kojo:test-integration -- --reporter=verbose 2>&1 | tee .release-evidence/logs/kojo-integration.log
