name: Release checks

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      version:
        type: string
        required: true
      stage:
        type: string
        required: true
      full_evidence:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest
    # The container tier builds an image and starts real containers; the browser tier builds the
    # Console first. Twenty minutes is roughly four times the observed run, which leaves room for a
    # slow runner without letting a hung daemon hold the queue all day.
    timeout-minutes: 30
    env:
      NO_COLOR: "1"
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Load prepared Release
        uses: ./.github/actions/release-checkout
        with:
          revision: ${{ inputs.revision }}

      # The suites stamp repositories and commit into them. A runner has no identity of its own, and
      # `git commit` without one fails with a message about `user.email` rather than about the test.
      #
      # **`init.defaultBranch` is deliberately not set here.** It was, for one day: the first CI run
      # of the container tier failed four suites with *the workspace is on master, and the merge
      # targets main*, because the fixtures ran a bare `git init` and took whatever the machine
      # offered. Declaring it made CI green and moved the assumption from one machine's
      # configuration to another's. Ticket 59 fixed the fixtures instead — every one of them now
      # passes `--initial-branch` built from `defaultTrunk`, the same constant `kojo init` stamps as
      # the trunk — so a runner's `master` default is no longer something this repository has an
      # opinion about. **Leaving it unset is what keeps that true**; if it comes back, the fixtures
      # have quietly started inheriting again.
      - name: Git identity for the fixtures
        run: |
          git config --global user.name "kojo ci"
          git config --global user.email "ci@kojo.invalid"

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Lint conventional commits
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          command: check

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --- the repo-wide checks, cheapest first --------------------------------------------------

      - name: TypeScript build
        run: bun tsc --build --verbose

      - name: Biome check
        run: bun biome check --verbose --no-errors-on-unmatched .

      - name: Dead-code analysis
        run: bun knip

      - name: Contract JSON codec source
        run: bun .github/scripts/check-contract-codecs.ts

      # --- the tiers ------------------------------------------------------------------------------
      # Every task is run **by name**, because a tier that is not named here is a tier nobody runs.
      # Discover the list with `moon query tasks`; it is not hardcoded anywhere else.

      - name: Contract and runtime tests
        run: |
          set -o pipefail
          mkdir -p .release-evidence/logs
          moon run kojo-client-contracts:test --force -- --reporter=verbose 2>&1 | tee .release-evidence/logs/contract-runtime.log
          moon run kojo-runner-contracts:test --force -- --reporter=verbose 2>&1 | tee -a .release-evidence/logs/contract-runtime.log
          moon run kojo-runtime:test --force -- --reporter=verbose 2>&1 | tee -a .release-evidence/logs/contract-runtime.log
          moon run kojo-runtime:test-integration --force -- --reporter=verbose 2>&1 | tee -a .release-evidence/logs/contract-runtime.log

      - name: Unit tests and package graph
        run: |
          set -o pipefail
          moon run kojo:test --force -- --reporter=verbose 2>&1 | tee .release-evidence/logs/kojo-unit.log
          moon run kojo:check-packages --force 2>&1 | tee -a .release-evidence/logs/kojo-unit.log

      # Two guards that are neither a test tier nor a lint: no bare promise reaches Kojo's published
      # declarations, and the package refuses to build without the Console in it.
      - name: Public types and package build
        run: moon run kojo:check-public-types kojo:build

      - name: Install Chromium for the browser tier
        run: bun x playwright install --with-deps chromium
        working-directory: apps/console

      - name: Browser tests
        run: |
          set -o pipefail
          moon run console:test-browser --force -- --reporter=list 2>&1 | tee .release-evidence/logs/console-browser.log

      # Last because it is the slowest and the only one that needs a container daemon. `ubuntu-latest`
      # ships Docker; the suites build the one image they need and skip with a stated reason if the
      # daemon is missing, so a runner without one says so rather than passing quietly.
      - name: Container tests
        run: |
          set -o pipefail
          moon run kojo:test-integration --force -- --reporter=verbose 2>&1 | tee .release-evidence/logs/kojo-integration.log

      - name: Record uncached core release evidence
        if: ${{ inputs.full_evidence }}
        run: bun .github/scripts/complete-release-evidence.ts collect-core .release-evidence/core-evidence.json "$(git rev-parse HEAD)" .release-evidence/logs

      - name: Upload core release evidence
        if: ${{ inputs.full_evidence }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-release-evidence
          path: .release-evidence
          include-hidden-files: true
          if-no-files-found: error

      - name: Pack tested npm archives
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_STAGE: ${{ inputs.stage }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          bun .github/scripts/release-train.ts pack "$RELEASE_VERSION" .release-train/packages
          bun .github/scripts/release-train.ts create-manifest "$RELEASE_STAGE" "$RELEASE_VERSION" "$RELEASE_REVISION" .release-train/packages .release-train/release-manifest.json

      - name: Upload tested npm archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: .release-train
          include-hidden-files: true
          if-no-files-found: error

  native-systemd-host:
    if: ${{ inputs.full_evidence }}
    name: Native systemd host evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Load prepared Release
        uses: ./.github/actions/release-checkout
        with:
          revision: ${{ inputs.revision }}

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install native Host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-user-session jq openssh-server policykit-1
          pinned_bun=$(sed -n 's/^bun = "\([^"]*\)"$/\1/p' .prototools)
          pinned_moon=$(sed -n 's/^moon = "\([^"]*\)"$/\1/p' .prototools)
          bun_binary="$HOME/.proto/tools/bun/$pinned_bun/bun"
          moon_binary="$HOME/.proto/tools/moon/$pinned_moon/moon"
          test -n "$pinned_bun"
          test -n "$pinned_moon"
          test -n "$bun_binary"
          test -x "$bun_binary"
          test "$("$bun_binary" --version)" = "$pinned_bun"
          test -n "$moon_binary"
          test -x "$moon_binary"
          test "$("$moon_binary" --version)" = "moon $pinned_moon"
          echo "Installing Bun from $bun_binary"
          echo "Installing Moon from $moon_binary"
          sudo install -m 0755 "$bun_binary" /usr/local/bin/bun
          sudo install -m 0755 "$moon_binary" /usr/local/bin/moon

      - name: Run native systemd Host evidence
        run: sudo bash .github/scripts/systemd-native-evidence.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/native-host-evidence" "$(git rev-parse HEAD)"

      - name: Upload native Host evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-systemd-host-evidence
          path: native-host-evidence
          if-no-files-found: error

  shipped-systemd-release:
    needs: ci
    if: ${{ inputs.full_evidence }}
    name: Shipped systemd release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Load prepared Release
        uses: ./.github/actions/release-checkout
        with:
          revision: ${{ inputs.revision }}

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download tested npm archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-candidate
          path: .release-train

      - name: Install native Host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-user-session jq openssh-server policykit-1
          pinned_bun=$(sed -n 's/^bun = "\([^"]*\)"$/\1/p' .prototools)
          pinned_moon=$(sed -n 's/^moon = "\([^"]*\)"$/\1/p' .prototools)
          bun_binary="$HOME/.proto/tools/bun/$pinned_bun/bun"
          moon_binary="$HOME/.proto/tools/moon/$pinned_moon/moon"
          test -n "$pinned_bun"
          test -n "$pinned_moon"
          test -n "$bun_binary"
          test -x "$bun_binary"
          test "$("$bun_binary" --version)" = "$pinned_bun"
          test -n "$moon_binary"
          test -x "$moon_binary"
          test "$("$moon_binary" --version)" = "moon $pinned_moon"
          sudo install -m 0755 "$bun_binary" /usr/local/bin/bun
          sudo install -m 0755 "$moon_binary" /usr/local/bin/moon

      - name: Run shipped systemd release evidence
        run: sudo bash .github/scripts/systemd-shipped-evidence.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/shipped-systemd-evidence" "$GITHUB_WORKSPACE/.release-train/packages" "$(git rev-parse HEAD)"

      - name: Upload shipped systemd evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shipped-systemd-release-evidence
          path: shipped-systemd-evidence
          if-no-files-found: error

  shipped-macos-release:
    needs: ci
    if: ${{ inputs.full_evidence }}
    name: Shipped macOS release evidence
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Load prepared Release
        uses: ./.github/actions/release-checkout
        with:
          revision: ${{ inputs.revision }}

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun x playwright install chromium

      - name: Download tested npm archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-candidate
          path: .release-train

      - name: Verify the shipped macOS installation
        env:
          KOJO_SHIPPED_MACOS_EVIDENCE: "1"
          KOJO_RELEASE_ARCHIVES: ${{ github.workspace }}/.release-train/packages
        run: |
          revision=$(git rev-parse HEAD)
          evidence_root="${RUNNER_TEMP}/artifacts/verification/daemon/${revision}"
          export KOJO_RELEASE_EVIDENCE_ROOT="${evidence_root}"
          set +e
          moon run kojo:test-release-macos 2>&1 | tee "${RUNNER_TEMP}/kojo-shipped-macos-vitest.log"
          status=${PIPESTATUS[0]}
          mkdir -p "${evidence_root}/RELEASE-01"
          cp "${RUNNER_TEMP}/kojo-shipped-macos-vitest.log" "${evidence_root}/RELEASE-01/vitest.log"
          exit "$status"

      - name: Upload shipped macOS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shipped-macos-release-evidence
          path: ${{ runner.temp }}/artifacts/verification/daemon
          if-no-files-found: error

  complete-release-evidence:
    if: ${{ inputs.full_evidence }}
    name: Complete breaking release evidence
    needs: [ci, native-systemd-host, shipped-systemd-release, shipped-macos-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load prepared Release
        uses: ./.github/actions/release-checkout
        with:
          revision: ${{ inputs.revision }}

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Install locked dependencies for evidence aggregation
        run: bun install --frozen-lockfile

      - name: Download core evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: core-release-evidence
          path: .release-evidence-input/core

      - name: Download native systemd evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-systemd-host-evidence
          path: .release-evidence-input/native-systemd

      - name: Download shipped systemd evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: shipped-systemd-release-evidence
          path: .release-evidence-input/shipped-systemd

      - name: Download shipped macOS evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: shipped-macos-release-evidence
          path: .release-evidence-input/shipped-macos

      - name: Accept the complete breaking release evidence
        run: bun .github/scripts/complete-release-evidence.ts complete .release-evidence-input .release-evidence-output "$(git rev-parse HEAD)"

      - name: Upload complete breaking release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: complete-breaking-release-evidence
          path: .release-evidence-output/artifacts/verification/daemon
          include-hidden-files: true
          if-no-files-found: error
