name: Release checks

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      version:
        type: string
        required: true
      stage:
        type: string
        required: true
      full_evidence:
        type: boolean
        required: true
    secrets:
      MOON_REMOTE_CACHE_TOKEN:
        required: false

permissions:
  contents: read

env:
  MOON_REMOTE_CACHE_TOKEN: ${{ secrets.MOON_REMOTE_CACHE_TOKEN }}

jobs:
  integration:
    uses: ./.github/workflows/integration.yml
    secrets:
      MOON_REMOTE_CACHE_TOKEN: ${{ secrets.MOON_REMOTE_CACHE_TOKEN }}
    with:
      revision: ${{ inputs.revision }}
      prepared_release: true

  ci:
    name: Core checks and packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NO_COLOR: "1"
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Load prepared Release
        uses: ./.github/actions/release-checkout
        with:
          revision: ${{ inputs.revision }}

      - name: Git identity for the fixtures
        run: |
          git config --global user.name "kojo ci"
          git config --global user.email "ci@kojo.invalid"

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Lint conventional commits
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: check

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: ./.github/actions/core-checks
      - name: Upload core test logs
        if: ${{ inputs.full_evidence }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-test-logs
          path: .release-evidence/logs
          include-hidden-files: true
          if-no-files-found: error

      - name: Pack tested npm archives
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_STAGE: ${{ inputs.stage }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          bun .github/scripts/release-train.ts pack "$RELEASE_VERSION" .release-train/packages
          bun .github/scripts/release-train.ts create-manifest "$RELEASE_STAGE" "$RELEASE_VERSION" "$RELEASE_REVISION" .release-train/packages .release-train/release-manifest.json

      - name: Upload tested npm archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: .release-train
          include-hidden-files: true
          if-no-files-found: error

  core-evidence:
    name: Collect core release evidence
    if: ${{ inputs.full_evidence }}
    needs: [ci, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Load prepared Release
        uses: ./.github/actions/release-checkout
        with:
          revision: ${{ inputs.revision }}

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
      - run: bun install --frozen-lockfile
      - name: Download core test logs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: core-test-logs
          path: .release-evidence/logs
      - name: Download integration logs
        if: ${{ inputs.full_evidence }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: integration-*
          path: .release-evidence/logs
          merge-multiple: true

      - name: Combine integration logs
        if: ${{ inputs.full_evidence }}
        run: |
          for shard in 1 2 3 4 5 6 7 8; do
            test -s ".release-evidence/logs/kojo-integration-$shard.log"
          done
          cat .release-evidence/logs/kojo-repository.log .release-evidence/logs/kojo-integration-{1,2,3,4,5,6,7,8}.log > .release-evidence/logs/kojo-integration.log

      - name: Record core release evidence
        if: ${{ inputs.full_evidence }}
        run: bun .github/scripts/complete-release-evidence.ts collect-core .release-evidence/core-evidence.json "$(git rev-parse HEAD)" .release-evidence/logs

      - name: Upload core release evidence
        if: ${{ inputs.full_evidence }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-release-evidence
          path: .release-evidence
          include-hidden-files: true
          if-no-files-found: error

  native-systemd-host:
    if: ${{ inputs.full_evidence }}
    name: Native systemd host evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Load prepared Release
        uses: ./.github/actions/release-checkout
        with:
          revision: ${{ inputs.revision }}

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install native Host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-user-session jq openssh-server policykit-1
          pinned_bun=$(sed -n 's/^bun = "\([^"]*\)"$/\1/p' .prototools)
          pinned_moon=$(sed -n 's/^moon = "\([^"]*\)"$/\1/p' .prototools)
          bun_binary="$HOME/.proto/tools/bun/$pinned_bun/bun"
          moon_binary="$HOME/.proto/tools/moon/$pinned_moon/moon"
          test -n "$pinned_bun"
          test -n "$pinned_moon"
          test -n "$bun_binary"
          test -x "$bun_binary"
          test "$("$bun_binary" --version)" = "$pinned_bun"
          test -n "$moon_binary"
          test -x "$moon_binary"
          test "$("$moon_binary" --version)" = "moon $pinned_moon"
          echo "Installing Bun from $bun_binary"
          echo "Installing Moon from $moon_binary"
          sudo install -m 0755 "$bun_binary" /usr/local/bin/bun
          sudo install -m 0755 "$moon_binary" /usr/local/bin/moon

      - name: Run native systemd Host evidence
        run: sudo bash .github/scripts/systemd-native-evidence.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/native-host-evidence" "$(git rev-parse HEAD)"

      - name: Upload native Host evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-systemd-host-evidence
          path: native-host-evidence
          if-no-files-found: error

  shipped-systemd-release:
    needs: ci
    if: ${{ inputs.full_evidence }}
    name: Shipped systemd release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Load prepared Release
        uses: ./.github/actions/release-checkout
        with:
          revision: ${{ inputs.revision }}

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download tested npm archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-packages
          path: .release-train

      - name: Install native Host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-user-session jq openssh-server policykit-1
          pinned_bun=$(sed -n 's/^bun = "\([^"]*\)"$/\1/p' .prototools)
          pinned_moon=$(sed -n 's/^moon = "\([^"]*\)"$/\1/p' .prototools)
          bun_binary="$HOME/.proto/tools/bun/$pinned_bun/bun"
          moon_binary="$HOME/.proto/tools/moon/$pinned_moon/moon"
          test -n "$pinned_bun"
          test -n "$pinned_moon"
          test -n "$bun_binary"
          test -x "$bun_binary"
          test "$("$bun_binary" --version)" = "$pinned_bun"
          test -n "$moon_binary"
          test -x "$moon_binary"
          test "$("$moon_binary" --version)" = "moon $pinned_moon"
          sudo install -m 0755 "$bun_binary" /usr/local/bin/bun
          sudo install -m 0755 "$moon_binary" /usr/local/bin/moon

      - name: Run shipped systemd release evidence
        run: sudo bash .github/scripts/systemd-shipped-evidence.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/shipped-systemd-evidence" "$GITHUB_WORKSPACE/.release-train/packages" "$(git rev-parse HEAD)"

      - name: Upload shipped systemd evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shipped-systemd-release-evidence
          path: shipped-systemd-evidence
          if-no-files-found: error

  shipped-macos-release:
    needs: ci
    if: ${{ inputs.full_evidence }}
    name: Shipped macOS release evidence
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Load prepared Release
        uses: ./.github/actions/release-checkout
        with:
          revision: ${{ inputs.revision }}

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Download tested npm archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-packages
          path: .release-train

      - name: Verify the shipped macOS installation
        env:
          KOJO_SHIPPED_MACOS_EVIDENCE: "1"
          KOJO_RELEASE_ARCHIVES: ${{ github.workspace }}/.release-train/packages
        run: |
          revision=$(git rev-parse HEAD)
          evidence_root="${RUNNER_TEMP}/artifacts/verification/daemon/${revision}"
          export KOJO_RELEASE_EVIDENCE_ROOT="${evidence_root}"
          set +e
          moon run kojo:test-release-macos 2>&1 | tee "${RUNNER_TEMP}/kojo-shipped-macos-vitest.log"
          status=${PIPESTATUS[0]}
          mkdir -p "${evidence_root}/RELEASE-01"
          cp "${RUNNER_TEMP}/kojo-shipped-macos-vitest.log" "${evidence_root}/RELEASE-01/vitest.log"
          exit "$status"

      - name: Upload shipped macOS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shipped-macos-release-evidence
          path: ${{ runner.temp }}/artifacts/verification/daemon
          if-no-files-found: error

  complete-release-evidence:
    if: ${{ inputs.full_evidence }}
    name: Complete breaking release evidence
    needs:
      [core-evidence, native-systemd-host, shipped-systemd-release, shipped-macos-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load prepared Release
        uses: ./.github/actions/release-checkout
        with:
          revision: ${{ inputs.revision }}

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Install locked dependencies for evidence aggregation
        run: bun install --frozen-lockfile

      - name: Download core evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: core-release-evidence
          path: .release-evidence-input/core

      - name: Download native systemd evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-systemd-host-evidence
          path: .release-evidence-input/native-systemd

      - name: Download shipped systemd evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: shipped-systemd-release-evidence
          path: .release-evidence-input/shipped-systemd

      - name: Download shipped macOS evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: shipped-macos-release-evidence
          path: .release-evidence-input/shipped-macos

      - name: Accept the complete breaking release evidence
        run: bun .github/scripts/complete-release-evidence.ts complete .release-evidence-input .release-evidence-output "$(git rev-parse HEAD)"

      - name: Upload complete breaking release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: complete-breaking-release-evidence
          path: .release-evidence-output/artifacts/verification/daemon
          include-hidden-files: true
          if-no-files-found: error
