name: release

# **Manual, and only manual.** There is no `push`, no tag trigger and no `schedule`, on purpose: a
# publish is irreversible — npm lets you unpublish for 72 hours and never reuse the version — so the
# decision to make one belongs to a human at the Actions tab, not to whatever last landed on `main`.
#
# The flow this fits into, and each step is a separate deliberate act:
#
#   1. bump the four public packages to one version and sync runtime-manifest.json
#   2. Actions → release → Run workflow    type that version, and this runs
#
# Bumping does not publish and publishing does not bump. That is why the version is typed here
# rather than read off the branch: typing it is the confirmation, and the job refuses if what you
# typed is not what `packages/kojo/package.json` says.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to publish — must equal all four public package manifests"
        required: true
        type: string
      dry_run:
        description: "Pack and check everything, publish nothing"
        required: false
        default: true
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A release must not contact an external agent. The real-agent suites stay disabled.
      # guard is not relying on the runner happening to have no terminal.
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The gate that makes typing the version meaningful. All public packages are one coordinated
      # release in this expand step, and the runtime manifest repeats its package version.
      - name: The version you typed is the version in every public manifest
        run: |
          typed="${{ inputs.version }}"
          for package in kojo-client-contracts kojo-runner-contracts kojo-runtime kojo; do
            declared=$(bun pm pkg get version --cwd "packages/$package" 2>/dev/null | tr -d '"' | tr -d '[:space:]')
            if [ "$declared" != "$typed" ]; then
              echo "::error::you asked to publish $typed, but packages/$package/package.json says $declared."
              exit 1
            fi
          done
          runtime=$(bun -e 'console.log((await Bun.file("packages/kojo-runtime/runtime-manifest.json").json()).packageVersion)')
          if [ "$runtime" != "$typed" ]; then
            echo "::error::runtime-manifest.json says $runtime, not $typed."
            exit 1
          fi
          echo "publishing the Kojo package set at $typed"

      # `0.0.0` is the unreleased placeholder. Publishing it would burn the first real version
      # number on a package nobody bumped.
      - name: Refuse the unreleased placeholder
        run: |
          if [ "${{ inputs.version }}" = "0.0.0" ]; then
            echo "::error::0.0.0 is the unreleased placeholder. Bump before releasing."
            exit 1
          fi

      # --- everything CI runs, because a release is not a lighter gate than a merge ---------------

      - name: Git identity for the fixtures
        run: |
          git config --global user.name "kojo release"
          git config --global user.email "release@kojo.invalid"

      - name: TypeScript build
        run: bun tsc --build --verbose

      - name: Biome check
        run: bun biome check --verbose --no-errors-on-unmatched .

      - name: Dead-code analysis
        run: bun knip

      - name: Contract, runtime, and unit tests
        run: moon run kojo-client-contracts:test kojo-runner-contracts:test kojo-runtime:test kojo-runtime:test-integration kojo:test kojo:check-packages

      - name: Container tests
        run: moon run kojo:test-integration

      # --- the tarball ----------------------------------------------------------------------------

      # `kojo:build` depends on `console:build`, so this is what puts the Console shell inside the
      # package. Skip it and `kojo ui` serves a placeholder to everybody who installs Kojo.
      - name: Public types and package build
        run: moon run kojo:check-public-types kojo:build

      # The tarball is inspected before it is sent, because `files` and `.gitignore` disagreeing is
      # exactly how the Console went missing once already. Two assertions: the shell is in, and the
      # tests are out.
      - name: The tarballs hold what they should
        run: |
          mkdir -p /tmp/kojo-release
          for package in kojo-client-contracts kojo-runner-contracts kojo-runtime kojo; do
            (cd "packages/$package" && bun pm pack --destination /tmp/kojo-release --quiet)
          done
          kojo_tarball=$(ls /tmp/kojo-release/carere-kojo-*.tgz | grep -v -- '-contracts-' | grep -v -- '-runtime-')
          tar -tzf "$kojo_tarball" > /tmp/kojo-contents.txt
          if ! grep -q '^package/console/index.html$' /tmp/kojo-contents.txt; then
            echo "::error::the Console shell is not in the tarball — kojo ui would serve a placeholder."
            exit 1
          fi
          for tarball in /tmp/kojo-release/*.tgz; do
            tar -tzf "$tarball" > /tmp/package-contents.txt
            if grep -q '^package/tests/' /tmp/package-contents.txt; then
              echo "::error::$tarball contains its test suite."
              exit 1
            fi
            if ! grep -q '^package/LICENSE$' /tmp/package-contents.txt; then
              echo "::error::$tarball has no LICENSE."
              exit 1
            fi
          done
          runtime_tarball=$(ls /tmp/kojo-release/carere-kojo-runtime-*.tgz)
          tar -tzf "$runtime_tarball" > /tmp/runtime-contents.txt
          for required in package/runtime-manifest.json package/src/runner/main.ts package/src/validator/main.ts; do
            grep -q "^$required$" /tmp/runtime-contents.txt || {
              echo "::error::the runtime tarball is missing $required."
              exit 1
            }
          done

      # Auth through `~/.npmrc` rather than an environment variable. `bun publish` has no `--token`
      # flag, and the registry line in an npmrc is the one form every client agrees on.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::the NPM_TOKEN repository secret is not set, so nothing can be published."
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
          for package in kojo-client-contracts kojo-runner-contracts kojo-runtime kojo; do
            (cd "packages/$package" && bun publish --access public)
          done
          rm -f ~/.npmrc

      - name: Dry run — nothing was published
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::dry run. Everything above passed; no tarball was sent."
          echo "::notice::re-run with 'Pack and check everything, publish nothing' unticked to publish."
