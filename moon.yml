layer: application
language: typescript

# The root project exists so repo-wide checks have somewhere to live. It declares its dependency on
# every published project for one specific reason: moon's TypeScript toolchain syncs project
# references *from the project graph*, so without this it rewrites the root `tsconfig.json` to
# `"references": []`. A later `bun tsc --build` then compiles nothing and exits 0 — a check that
# reports green while doing no work, which is the failure mode this repo has now hit twice.
dependsOn:
  - release-tooling
  - kojo-client-contracts
  - kojo
  - kojo-runner-contracts
  - kojo-runtime

# The root reference list also includes the Console application.
toolchains:
  typescript:
    syncProjectReferences: false

tasks:
  check:
    inputs:
      - /apps/**/*
      - /examples/**/*
      - /packages/**/*
      - /.github/**/*
      - /.kojo/**/*
      - /*.json
  tsc:
    deps:
      - console:tsc
    outputs: []
    options:
      mergeOutputs: replace
