$schema: "../../.moon/cache/schemas/project.json"

dependsOn:
  - id: test-support
    scope: development

tasks:
  dev:
    command: bun --bun vite dev
    description: Start the Kojo visualizer
    preset: server

  build:
    command: bun --bun vite build
    description: Build the Kojo visualizer
    inputs:
      - "@group(configs)"
      - "@group(sources)"
      - "@group(workspace)"
      - "@group(translations)"
    outputs:
      - "dist/"
      - "src/i18n/"
    type: build

  unit-test:
    command: bun --bun vitest run --project unit
    description: Run visualizer unit tests
    inputs:
      - "@group(configs)"
      - "@group(sources)"
      - "@group(tests)"
      - "@group(translations)"
    type: test

  integration-test:
    command: bun --bun vitest run --project integration
    description: Run visualizer integration tests
    inputs:
      - "@group(configs)"
      - "@group(sources)"
      - "@group(tests)"
      - "@group(translations)"
    type: test

  browser-test:
    command: bun --bun vitest run --project browser --project browser-e2e
    description: Run visualizer browser tests
    inputs:
      - "@group(configs)"
      - "@group(sources)"
      - "@group(tests)"
      - "@group(translations)"
    type: test

  preview:
    command: bun --bun vite preview
    description: Preview the visualizer production build
    preset: server

  zaidan-add:
    command: bunx shadcn@latest add
    description: Add a Zaidan component
    preset: utility
