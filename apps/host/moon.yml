$schema: "../../.moon/cache/schemas/project.json"

tasks:
  dev:
    command: bun run apps/host/main.ts
    options:
      runFromWorkspaceRoot: true
    preset: server

  test:
    command: bun --bun vitest run --project unit --passWithNoTests
    inputs:
      - "@group(configs)"
      - "@group(sources)"
      - "@group(tests)"
      - "@group(workspace)"
    type: test

  integration-test:
    command: bun --bun vitest run --project integration
    inputs:
      - "@group(configs)"
      - "@group(sources)"
      - "@group(tests)"
      - "@group(workspace)"
    type: test
