layer: application
language: typescript

dependsOn:
  - kojo-client-contracts

tasks:
  tsc:
    outputs:
      - /.moon/cache/types/apps/console

  # The front end alone. The API comes from the per-user Daemon, which the Vite config proxies to.
  dev:
    command: vite dev
    preset: server

  # A prerendered shell plus the client bundle, written straight into `packages/kojo/console` so the
  # published package carries the Console. The output is declared workspace-relative because it is
  # outside this project.
  build:
    command: vite build
    inputs:
      - src/**/*
      - vite.config.ts
      - tsconfig.json
      - package.json
      - /packages/kojo-client-contracts/src/**/*
      - /packages/kojo-client-contracts/package.json
    outputs:
      - "/packages/kojo/console"

  # The browser tier uses an isolated Daemon fixture. It depends on the build because the thing under
  # test is the built page, not a development-only module graph.
  test-browser:
    command: playwright test
    deps:
      - ~:build
    inputs:
      - src/**/*
      - tests/**/*
      - playwright.config.ts
      - /packages/kojo/src/**/*
      - /packages/kojo/tests/support/daemon/**/*
      - /packages/kojo/package.json
      - /packages/kojo-runtime/src/**/*
      - /packages/kojo-runtime/package.json
      - /packages/kojo-runtime/runtime-manifest.json
      - /packages/kojo-client-contracts/src/**/*
      - /packages/kojo-client-contracts/package.json
      - /packages/kojo-runner-contracts/src/**/*
      - /packages/kojo-runner-contracts/package.json
