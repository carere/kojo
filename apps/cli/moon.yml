$schema: "../../.moon/cache/schemas/project.json"

tasks:
  dev:
    command: bun run apps/cli/main.ts
    description: Run the Kojo CLI
    options:
      runFromWorkspaceRoot: true
    preset: utility

  test:
    command: bun --bun vitest run --project unit
    description: Run CLI unit tests
    inputs:
      - "@group(configs)"
      - "@group(sources)"
      - "@group(tests)"
      - "@group(workspace)"
    type: test

  integration-test:
    command: bun --bun vitest run --project integration --passWithNoTests
    description: Run CLI integration tests
    inputs:
      - "@group(configs)"
      - "@group(sources)"
      - "@group(tests)"
      - "@group(workspace)"
    type: test
