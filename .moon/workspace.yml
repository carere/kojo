$schema: ./cache/schemas/workspace.json

projects:
  globs:
    - "apps/*"
    - "packages/*"
  sources:
    root: "."
    release-tooling: ".github"

vcs:
  defaultBranch: "main"
  provider: "github"

remote:
  api: "http"
  host: "https://remoshu.carere.workers.dev/"
  auth:
    token: "REMOSHU_TOKEN"
  cache:
    instanceName: "carere/kojo"
    verifyIntegrity: true
