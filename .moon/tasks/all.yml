$schema: ../cache/schemas/tasks.json

# All tasks use the workspace toolchain and resolved dependencies.
implicitInputs:
  - /bun.lock
  - /package.json
  - /tsconfig.options.json
  - /.prototools
  - "{package,tsconfig}.json"

tasks:
  check:
    command: "biome check --no-errors-on-unmatched ."
    inputs:
      - "**/*"
      - /biome.json

  fix:
    command: "biome check --write --no-errors-on-unmatched ."
    options:
      cache: false

  # Restore referenced declarations before the compiler checks this project.
  # Each project owns only its own emitted declarations and build information.
  tsc:
    command: "tsc --build --verbose"
    deps:
      - ^:tsc
    inputs:
      - /tsconfig.json
      - /apps/*/src/**/*
      - /apps/*/tests/**/*
      - /apps/*/*.ts
      - /apps/*/*.json
      - /packages/*/src/**/*
      - /packages/*/tests/**/*
      - /packages/*/*.ts
      - /packages/*/*.json
      - /.github/scripts/**/*
      - /.github/tsconfig.json
